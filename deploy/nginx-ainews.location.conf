# Put these two locations inside the existing `server { ... }` block for
# nasserdiary.com, in the HTTPS (443) server block.
#
# Nginx strips /ainews/ before proxying. X-Forwarded-Prefix tells Flask to
# generate URLs and static paths with /ainews again.

location = /ainews {
    return 301 /ainews/;
}

location /ainews/ {
    proxy_pass http://127.0.0.1:8000/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /ainews;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;

    client_max_body_size 512M;
}
